<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章列表 | 茶文化博客</title>
  <link rel="stylesheet" href="assets/css/style.postcard.css">
</head>
<body>
  <!-- 统一导航栏 -->
  <header>
    <h1>文章列表</h1>
    <nav>
      <a href="index.html">首页</a>
      <a href="about.html">关于</a>
      <a href="posts.html">文章</a>
    </nav>
  </header>

  <!-- 主体内容 -->
  <main>
    <section>
      <h2>博客文章</h2>
      <div class="postcards">
        {% for post in site.posts %}
        <article class="postcard">
          <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
          <p class="date">{{ post.date | date: "%Y-%m-%d" }}</p>
          <p class="excerpt">
            {{ post.excerpt | strip_html | truncate: 100 }}
          </p>
          <a class="readmore" href="{{ post.url | relative_url }}">阅读全文 →</a>
        </article>
        {% endfor %}
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer>
    <p>&copy; 2026 Cheng81446 | 茶文化博客 · Powered by GitHub Pages</p>
  </footer>
</body>
</html>

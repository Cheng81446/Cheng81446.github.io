# ========================================
# 站点基本信息
# ========================================
title: "在代码与茶汤之间游走的行者"
description: "分享茶文化、技术思考与人生感悟"
author: Cheng81446
email: cpcixora@gmail.com
url: "https://cheng81446.github.io"
baseurl: ""   # ⚠️ 用户站点必须留空！

# ========================================
# 文章集合（Collections）- 核心功能
# ========================================
collections:
  tea_essays:
    output: true
    permalink: /tea/:title/
    description: "🍵 茶事随笔 — 品茶的感受、茶文化知识"
  tech_notes:
    output: true
    permalink: /tech/:title/
    description: "💻 技术笔记 — 编程学习、项目分享"
  life_reflections:
    output: true
    permalink: /life/:title/
    description: "🧘 生活感悟 — 人生思考、生活哲学"

# ========================================
# 默认布局（自动套用）
# ========================================
defaults:
  - scope:
      path: ""
      type: tea_essays
    values:
      layout: post
  - scope:
      path: ""
      type: tech_notes
    values:
      layout: post
  - scope:
      path: ""
      type: life_reflections
    values:
      layout: post

# ========================================
# 主题与插件
# ========================================
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# ========================================
# 其他设置
# ========================================
timezone: Asia/Kuala_Lumpur
markdown: kramdown
highlighter: rouge
permalink: pretty

# 排除文件（不打包到网站）
exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
